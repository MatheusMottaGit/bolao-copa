name: Deploy bolao

on:
  push:
    branches: [ main ]

env:
  IMAGE: ghcr.io/matheusmottagit/bolao-copa

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}
      
      - name: Debug loaded key
        run: ssh-add -l

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          n=0
          until ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "ssh-keyscan falhou após 3 tentativas"
              exit 1
            fi
            echo "Tentativa $n falhou, repetindo em 5s..."
            sleep 5
          done

      - name: Copy docker-compose.yml to VPS
        run: scp docker-compose.yml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/docker/bolao_copa/docker-compose.yml

      - name: Write .env to VPS
        run: |
          {
            echo "APP_NAME=Bolao Copa"
            echo "APP_ENV=production"
            echo "APP_DEBUG=false"
            echo "APP_KEY=${{ secrets.APP_KEY }}"
            echo "APP_URL=${{ secrets.APP_URL }}"
            echo "APP_LOCALE=pt_BR"
            echo "APP_FALLBACK_LOCALE=pt_BR"
            echo "DB_CONNECTION=mysql"
            echo "DB_HOST=db"
            echo "DB_PORT=3306"
            echo "DB_DATABASE=${{ secrets.DB_DATABASE }}"
            echo "DB_USERNAME=${{ secrets.DB_USERNAME }}"
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}"
            echo "DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}"
            echo "SESSION_DRIVER=database"
            echo "CACHE_STORE=database"
            echo "QUEUE_CONNECTION=database"
            echo "LOG_CHANNEL=stack"
            echo "LOG_LEVEL=error"
            echo "FOOTBALL_API_KEY=${{ secrets.FOOTBALL_API_KEY }}"
            echo "FOOTBALL_API_URL=${{ secrets.FOOTBALL_API_URL }}"
          } | ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p /docker/bolao_copa && cat > /docker/bolao_copa/.env"

      - name: Start containers
        run: >
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          "mkdir -p /docker/bolao_copa/storage &&
          cd /docker/bolao_copa &&
          docker compose pull &&
          docker compose up -d"
