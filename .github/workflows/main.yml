name: Deploy bolao

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Deploy to Hostinger
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ secrets.HOSTINGER_VM_ID }}
          project-name: bolao_copa
          docker-compose-path: docker-compose.yml
          environment-variables: |
            APP_NAME=Bolão Copa
            APP_ENV=production
            APP_DEBUG=false
            APP_KEY=${{ secrets.APP_KEY }}
            APP_URL=${{ secrets.APP_URL }}
            APP_LOCALE=pt_BR
            APP_FALLBACK_LOCALE=pt_BR
            DB_CONNECTION=mysql
            DB_HOST=db
            DB_PORT=3306
            DB_DATABASE=${{ secrets.DB_DATABASE }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
            SESSION_DRIVER=database
            CACHE_STORE=database
            QUEUE_CONNECTION=database
            LOG_CHANNEL=stack
            LOG_LEVEL=error
            FOOTBALL_API_KEY=${{ secrets.FOOTBALL_API_KEY }}
            FOOTBALL_API_URL=${{ secrets.FOOTBALL_API_URL }}
